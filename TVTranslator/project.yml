name: REBOXTV
options:
  bundleIdPrefix: com.tmoath07
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  REBOXTV:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "REBOX TV"
        NSLocalNetworkUsageDescription: "إرسال الترجمات إلى التلفزيون المتصل بنفس شبكة الواي فاي."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tmoath07.reboxtv
        PRODUCT_NAME: REBOXTV
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "3"
