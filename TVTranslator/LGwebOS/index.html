<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REBOX TV | LG webOS</title>
<style>
:root{font-family:"Noto Naskh Arabic",Tahoma,Arial,sans-serif;color:white}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
#caption{box-sizing:border-box;position:absolute;top:75%;left:5%;width:90%;display:none;
border-radius:14px;padding:10px 24px;text-align:center;font-weight:700;font-size:25pt;
white-space:pre-wrap;line-height:1.48;text-shadow:0 2px 5px #000;}
#setup{position:absolute;right:5%;top:8%;width:620px;max-width:80vw;box-sizing:border-box;padding:26px;
background:rgba(10,16,29,.95);border:2px solid #5cd5ff;border-radius:22px;box-shadow:0 14px 40px #0008;}
h1{font-size:34px;margin:0 0 14px;color:#65d8ff}
p{font-size:20px;line-height:1.5;color:#e0e4eb;margin:12px 0}
input{box-sizing:border-box;width:100%;font-size:25px;padding:12px;color:#fff;background:#101d2e;
border:2px solid #7499ac;border-radius:11px;direction:ltr;text-align:left;}
button{margin:14px 0 0;background:#55d8ff;color:#071623;border:0;border-radius:12px;
padding:15px 24px;font-size:22px;font-weight:bold;cursor:pointer}
button:focus,input:focus{outline:4px solid #fff}
#hint{font-size:17px;color:#a6bcc8}
#diagnostic{position:absolute;bottom:25px;right:5%;font-size:16px;color:#6bd5fa;
text-shadow:0 2px 5px #000;display:none}
</style>
</head>
<body>
<div id="caption" aria-live="polite"></div>
<div id="setup">
  <h1>REBOX TV — LG webOS</h1>
  <p>أدخل عنوان IP الخاص بالآيفون أو الآيباد من شاشة REBOX TV، وعلى نفس شبكة الواي فاي.</p>
  <input id="server" type="url" inputmode="url" placeholder="http://192.168.0.100:8080" autocomplete="off"/>
  <div><button id="start" type="button">تشغيل استقبال الترجمة</button></div>
  <p id="state">غير متصل</p>
  <p id="hint">اضغط الزر الأوسط بالريموت لإظهار الإعدادات من جديد. استعمل رجوع لإخفائها. هذا العرض فوق HDMI تجريبي وغير مضمون على جميع موديلات LG.</p>
</div>
<div id="diagnostic"></div>
<script src="receiver.js"></script>
</body>
</html>
