name: Build REBOX TV Android Receiver
on:
  workflow_dispatch:
  push:
    branches:
      - feature/tv-translator-free-v1
    paths:
      - "TVTranslator/AndroidTV/**"
      - ".github/workflows/tv-android.yml"
  pull_request:
    paths:
      - "TVTranslator/AndroidTV/**"
      - ".github/workflows/tv-android.yml"
jobs:
  tv-receiver-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK 35
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        working-directory: TVTranslator/AndroidTV
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: REBOX-TV-Android-Receiver-APK
          path: TVTranslator/AndroidTV/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
