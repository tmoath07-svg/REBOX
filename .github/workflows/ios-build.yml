name: REBOX iPadOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build simulator app and unsigned device IPA
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Patch Starfold WebRTC startup
        run: python3 scripts/patch-starfold-stream.py

      - name: Select Xcode
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project REBOX.xcodeproj -scheme REBOX

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project REBOX.xcodeproj \
            -scheme REBOX \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/Simulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify Microsoft OAuth client configuration
        run: |
          APP_PLIST="build/Simulator/Build/Products/Debug-iphonesimulator/REBOX.app/Info.plist"
          test -f "$APP_PLIST"
          CLIENT_ID=$(/usr/libexec/PlistBuddy -c "Print :StarfoldMicrosoftClientID" "$APP_PLIST")
          test "$CLIENT_ID" = "1f907974-e22b-4810-a9de-d9647380c97e"
          echo "Microsoft OAuth client ID is present in the built app."

      - name: Package simulator app
        run: |
          APP_PATH="build/Simulator/Build/Products/Debug-iphonesimulator/REBOX.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/REBOX-Simulator-App.zip

      - name: Archive for physical iPad (unsigned)
        run: |
          xcodebuild \
            -project REBOX.xcodeproj \
            -scheme REBOX \
            -destination 'generic/platform=iOS' \
            -archivePath build/REBOX-Unsigned.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/REBOX-Unsigned.xcarchive/Products/Applications/REBOX.app"
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload
          ditto "$APP_PATH" build/ipa/Payload/REBOX.app
          (cd build/ipa && /usr/bin/zip -qry ../REBOX-unsigned.ipa Payload)
          test -s build/REBOX-unsigned.ipa

      - name: Upload simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: REBOX-iPadOS-Simulator
          path: build/REBOX-Simulator-App.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: REBOX-unsigned-IPA
          path: build/REBOX-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
