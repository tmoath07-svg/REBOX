name: REBOX
options:
  bundleIdPrefix: com.tmoath07
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_UPCOMING_FEATURE_NONISOLATED_NONSENDING_BY_DEFAULT: YES
    SWIFT_UPCOMING_FEATURE_INFER_ISOLATED_CONFORMANCES: YES
packages:
  StarfoldShared:
    path: StarfoldVendor/Packages/StarfoldShared
  StreamKit:
    path: StarfoldVendor/Packages/StreamKit
  XboxKit:
    path: StarfoldVendor/Packages/XboxKit
targets:
  REBOX:
    type: application
    platform: iOS
    dependencies:
      - package: StarfoldShared
      - package: StreamKit
      - package: XboxKit
    sources:
      - path: REBOX
        excludes:
          - Info.plist
          # Legacy placeholder UI is not part of the Starfold streaming app.
          - ControllerManager.swift
          - ContentView.swift
          - StreamingEngine.swift
          - Theme.swift
      - path: StarfoldVendor/StarfoldiOS
        excludes:
          - StarfoldiOSApp.swift
          - Configuration/Info.plist
      - path: "StarfoldVendor/Preview Content"
    info:
      path: REBOX/Info.plist
      properties:
        # Starfold reads this exact key from Bundle.main.infoDictionary.
        StarfoldMicrosoftClientID: "1f907974-e22b-4810-a9de-d9647380c97e"
        # Required for AVAudioSession playback to continue after screen lock.
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tmoath07.rebox
        PRODUCT_NAME: REBOX
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: "1.01"
